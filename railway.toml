[build]
builder = "nixpacks"
# Pin pnpm to the packageManager version and freeze the lockfile so deploy
# installs are reproducible: what was tested locally is what ships. If this
# fails on Railway, the lockfile is out of sync; run `pnpm install` locally
# and commit the lockfile rather than loosening this.
buildCommand = "npm install -g pnpm@10.4.1 && pnpm install --frozen-lockfile && pnpm run build"

[deploy]
# NODE_ENV=production is set here because nothing else sets it: the esbuild
# bundle doesn't define it and Railway's variables didn't carry it, so until
# 2026-09-28 production ran with it unset and every `NODE_ENV === "production"`
# branch was off (webhooks skipped their signature checks when a secret was
# missing, tRPC errors carried stack traces, the cookie Secure fallback and the
# daily crowdpool timer never ran). Same as package.json "start".
startCommand = "NODE_ENV=production node dist/index.js"
# Gate promotion on the app actually serving. Without this Railway marks a
# deploy healthy as soon as the process starts, so a boot that binds but
# can't serve (bad env, DB unreachable) would still go live.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# Migrations are applied manually via scripts/run-migration.ts (the custom
# runner + _migrations_applied table). The runner discovers every numbered
# file from 0000 and applies whatever the tracking table does not list; the
# "migrations 0048+" this comment used to claim was wrong, and the foundation
# audit inherited that error. Fresh databases come from drizzle/ci-baseline.sql
# instead, because 36 of the historical files cannot replay onto an empty
# database (ADR-37). The old `drizzle-kit migrate` preDeployCommand was a
# vestigial no-op (its journal stops at 0047) and misleadingly ran on other
# services; removed.

[[services]]
name = "web"
