    <!-- Additional structured data for AI accessibility.
         This block ships in the shell, so it is present on every route. It is
         scoped to the homepage by @id + url so it cannot compete with a
         per-page FAQPage: /learn/:slug injects its own article FAQPage at
         <url>#faq, and an unscoped second FAQPage on the same URL would leave
         an answer engine to guess which one describes the page. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "@id": "https://regencivics.earth/#faq",
      "url": "https://regencivics.earth/",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is ReGen Civics?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "ReGen Civics builds the tools and runs the in-real-life game that regenerative land projects use today. Its year turns through four seasons: land projects design their games, crowdpool what they need, build on the land, and rest. Church of the Regenerative Earth (CORE) is the church and operating entity. ReGen Civics is the platform and alliance; it is not the church. The ReGen Network Cooperative is in design; it is not part of CORE and is not yet an entity."
          }
        },
        {
          "@type": "Question",
          "name": "What is the ReGen Network Cooperative?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The ReGen Network Cooperative is being designed as a member-owned cooperative in which land projects and people buy and steward land together, governed democratically by the network itself. It is not yet a legal entity and it accepts no money. We are designing it now with land projects, future members and counsel. You can tell us you're interested at regencivics.earth/loi. Telling us you're interested is not a commitment and involves no money. We'll keep you posted as the cooperative takes shape and invite you into the design conversations."
          }
        },
        {
          "@type": "Question",
          "name": "How can I support regenerative land projects?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Play the Game, join a season, or bring what you have to a land project through crowdpooling. Crowdpooling coordinates and accounts for what people bring to land projects: time, things, skills, land and money. Money goes through outside partners each project holds, never through ReGen Civics. The campaigns shown today are examples; real campaigns open when Season 2 starts crowdpooling."
          }
        },
        {
          "@type": "Question",
          "name": "What is the Infinite Game?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Infinite Game is our approach to regenerative development. Unlike finite games played to win, infinite games are played to continue playing. We design our systems to create lasting positive impact that compounds across generations."
          }
        },
        {
          "@type": "Question",
          "name": "How do I join ReGen Civics?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "You can join by attending our community sessions, completing quests, or applying to bring your land project into the next season. Visit our Team page to learn about open roles, or check the Schedule page for upcoming events."
          }
        },
        {
          "@type": "Question",
          "name": "What are ReGen Civics tokens?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "The Game has two tokens: $ReGen, earned for contributions like quests and bounties, and RGVoice, which carries governance voice in the Game. Tokens in ReGen Civics record contributions and carry governance weight in the Game. They make no claim about financial value. $RCivics comes from the earlier fund design. Its role, if any, in the cooperative is being reviewed with counsel. RCVoice comes from the earlier fund design. The cooperative is designed to vote one member, one vote, and how RCVoice relates to that is being reviewed with counsel."
          }
        }
      ]
    }
    </script>
