<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline — ReGen Civics</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0d2818;color:#e0e0e0;font-family:system-ui,-apple-system,sans-serif;text-align:center;padding:2rem}
h1{font-size:1.5rem;margin-bottom:.75rem;color:#7dd87d;font-weight:600}
p{font-size:1rem;opacity:.8;margin-bottom:1.5rem;line-height:1.5}
button{background:#1a472a;color:#fff;border:1px solid #7dd87d40;padding:.6rem 1.5rem;border-radius:9999px;font-size:.875rem;cursor:pointer;transition:background .2s}
button:hover{background:#2d6a4f}
</style>
</head>
<body>
<div>
<h1>ReGen Civics</h1>
<p>Your internet is not strong enough for this Game</p>
<button onclick="window.location.reload()">Retry</button>
</div>
<script>
  // If the browser reports online, this is likely a stale service worker response
  // or a slow connection. Auto-retry with increasing delays.
  if (navigator.onLine) {
    setTimeout(function() { window.location.reload(); }, 1500);
  }
  window.addEventListener('online', function() { window.location.reload(); });
  // Safari can be slow to update navigator.onLine. Retry once more after 4s regardless.
  setTimeout(function() {
    if (document.visibilityState === 'visible') window.location.reload();
  }, 4000);
</script>
</body>
</html>
