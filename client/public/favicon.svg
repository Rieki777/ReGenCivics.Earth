<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Seed of Life: center circle + 6 surrounding circles at 60° intervals -->
  <!-- Outer boundary ring -->
  <circle cx="50" cy="50" r="32" stroke="#7dd87d" stroke-width="1.2" opacity="0.55"/>
  <!-- Petal circles: 6 surrounding at distance r=16 from center, radius r=16 -->
  <circle cx="50"    cy="34"    r="16" stroke="#7dd87d" stroke-width="1.5" opacity="0.85"/>
  <circle cx="63.86" cy="42"    r="16" stroke="#7dd87d" stroke-width="1.5" opacity="0.85"/>
  <circle cx="63.86" cy="58"    r="16" stroke="#7dd87d" stroke-width="1.5" opacity="0.85"/>
  <circle cx="50"    cy="66"    r="16" stroke="#7dd87d" stroke-width="1.5" opacity="0.85"/>
  <circle cx="36.14" cy="58"    r="16" stroke="#7dd87d" stroke-width="1.5" opacity="0.85"/>
  <circle cx="36.14" cy="42"    r="16" stroke="#7dd87d" stroke-width="1.5" opacity="0.85"/>
  <!-- Center circle -->
  <circle cx="50"    cy="50"    r="16" stroke="#7dd87d" stroke-width="1.5"/>
</svg>
