<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dark green circle background -->
  <circle cx="50" cy="50" r="50" fill="#1a472a"/>

  <!-- Left wing — sweeping arc up-left, bold fill -->
  <path d="M50 62 C44 54,28 48,18 38 C24 42,32 50,38 56 C30 46,20 36,16 22 C22 32,32 44,42 52 C34 38,28 24,30 12 C34 26,40 42,44 54Z" fill="#FFD700"/>
  <!-- Right wing — mirror -->
  <path d="M50 62 C56 54,72 48,82 38 C76 42,68 50,62 56 C70 46,80 36,84 22 C78 32,68 44,58 52 C66 38,72 24,70 12 C66 26,60 42,56 54Z" fill="#FFD700"/>
  <!-- Wing depth shading -->
  <path d="M50 62 C46 56,34 52,24 44 C30 48,38 54,44 58Z" fill="#d4a574" opacity="0.55"/>
  <path d="M50 62 C54 56,66 52,76 44 C70 48,62 54,56 58Z" fill="#d4a574" opacity="0.55"/>

  <!-- Central body -->
  <ellipse cx="50" cy="58" rx="5" ry="9" fill="#FFD700"/>
  <!-- Neck -->
  <ellipse cx="50" cy="47" rx="3.5" ry="5" fill="#FFD700"/>
  <!-- Head -->
  <ellipse cx="50" cy="41" rx="4" ry="4" fill="#FFD700"/>
  <!-- Head crest -->
  <path d="M48 38 C49 33,51 31,52 34 C51 36,50 38,49 39Z" fill="#FFD700"/>
  <path d="M50 31 C51.5 27,53 26,53.5 29 C52 31,51 33,50 35Z" fill="#d4a574"/>

  <!-- Tail feathers -->
  <line x1="47" y1="67" x2="38" y2="87" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="50" y1="68" x2="50" y2="90" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="53" y1="67" x2="62" y2="87" stroke="#FFD700" stroke-width="3" stroke-linecap="round"/>
  <line x1="45" y1="68" x2="34" y2="89" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="55" y1="68" x2="66" y2="89" stroke="#d4a574" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Eye -->
  <circle cx="51.5" cy="40" r="1.5" fill="#1a472a"/>
  <circle cx="52" cy="39.5" r="0.5" fill="#FFD700"/>
</svg>
