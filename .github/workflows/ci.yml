name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # Vault tripwire (Mycelium review R3): the second-brain vault is Rye's
      # private memory and lives gitignored inside the repo folder. This fails
      # the build the day a careless .gitignore edit lets it into a commit.
      - name: Vault tripwire (second-brain/ must never be committed)
        run: |
          if git ls-files -- 'second-brain/*' | grep -q .; then
            echo "::error::second-brain/ paths are committed. The vault is private; revert the commit and fix .gitignore."
            git ls-files -- 'second-brain/*' | head -20
            exit 1
          fi

      # Foundation guards (audit Phase 1): unique migration numbers and a
      # complete .env.example. Cheap, fail fast.
      - name: Migration number guard
        run: node scripts/check-migration-numbers.mjs

      - name: Env example completeness
        run: node scripts/check-env-example.mjs

      # The fund's story stays true, and stays in one place. Bans twelve
      # retired claims and requires every surface that describes the fund to
      # read its facts from shared/fund.ts. The second half is the one that
      # matters: the crawler prose said "8 to 12%" while the page said
      # "12 to 18%" for about two years, and no banned-phrase grep would ever
      # have caught it, because neither sentence was banned.
      - name: Fund claims guard
        run: node scripts/check-fund-claims.mjs

      # Non-blocking CVE check. Reports findings but does not fail the
      # build, since transitive deps occasionally land moderate CVEs we
      # don't control. Treat as a watchdog signal, follow up out-of-band.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level moderate || true

      - name: Unit tests
        run: pnpm test
        env:
          # No DATABASE_URL here on purpose: DB-backed suites key their
          # skipIfNoDb guard on it. A fake URL makes them run against a dead
          # socket and fail with connection errors (this kept main's CI red
          # for weeks). The DB-backed suites run against the real dev DB in
          # the local ship gate (`pnpm test:all`); wiring them into GitHub CI
          # needs a fresh-schema build decision (see the note on the disabled
          # integration job below).
          JWT_SECRET: ci-test-secret

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-test-secret
          DATABASE_URL: mysql://test:test@localhost:3306/test
          VITE_APP_ID: ci-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          retention-days: 1

  # ── Integration tests against a real MySQL ──
  # The DB-backed suites (evolution, ratification, forum, applications, ...) gate
  # every push against a real database built from scratch.
  #
  # The fresh schema comes from drizzle/ci-baseline.sql, not from the numbered
  # migrations: 36 of those fail on an empty MySQL across five root causes and
  # are frozen as history rather than repaired (ADR-37). run-migration.ts still
  # runs afterward, so migrations added since the baseline are exercised here.
  #
  # mysql:9.4 matches the production server version. Do not drift to mysql:8
  # without checking the baseline still loads.
  integration:
    name: Integration (real MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:9.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: regen_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:ci@127.0.0.1:3306/regen_ci
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build fresh schema from the CI baseline
        run: npx tsx scripts/load-ci-baseline.ts

      - name: Apply migrations added since the baseline
        run: npx tsx scripts/run-migration.ts --all

      - name: Fail if the baseline has drifted from the live schema
        run: npx tsx scripts/check-schema-drift.ts

      - name: Integration tests
        run: pnpm test:all

  # ── Evolution Engine machine gates (ASSEMBLY_PAGE_SPEC.md section 7.3) ──
  # Runs ONLY for PRs whose head branch is assembly/<proposalId>: the branches
  # the Rung 3 builder agent opens. Verifies the diff against the ratified
  # scope fetched from the PRODUCTION SERVER (never from a file on the branch
  # under review — the machine must not write its own permission slip), then
  # applies the gates-passed label the launch window waits for. Inert today:
  # no assembly/* branches exist below autonomy tier 3.
  assembly-gates:
    name: Assembly machine gates
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'assembly/') }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch ratified scope from the server (source of truth)
        run: |
          PROPOSAL_ID="${GITHUB_HEAD_REF#assembly/}"
          if ! [[ "$PROPOSAL_ID" =~ ^[0-9]+$ ]]; then
            echo "Branch does not carry a numeric proposal id; failing closed."
            exit 1
          fi
          INPUT=$(jq -cn --argjson id "$PROPOSAL_ID" '{json:{proposalId:$id}}' | jq -sRr @uri)
          SCOPE=$(curl -sf --max-time 30 "https://regencivics.earth/api/trpc/assembly.proposalScope?input=${INPUT}" \
            | jq -c '.result.data.json.scopePaths')
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "null" ] || [ "$SCOPE" = "[]" ]; then
            echo "No ratified feature scope on proposal #$PROPOSAL_ID; failing closed."
            exit 1
          fi
          jq -n --argjson sp "$SCOPE" '{scopePaths: $sp}' > .assembly-scope.json
          echo "Server scope for proposal #$PROPOSAL_ID: $SCOPE"

      - name: Protected-paths check (fail closed)
        run: node scripts/check-protected-paths.mjs "origin/${GITHUB_BASE_REF}" "${GITHUB_SHA}"

      - name: Apply gates-passed label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label gates-passed --repo "${{ github.repository }}"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10
    # Advisory, not blocking (audit Phase 1: honest gates). LHCI 'collect' has
    # been failing on main for weeks and turning every run red, which trains
    # reviewers to ignore red. It still runs and uploads reports; it just no
    # longer fails the workflow. Re-block once the collect step is reliable.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-public
          path: dist/public

      # -s = SPA fallback: serve index.html for client routes (/fund, /apply,
      # /community) instead of 404, so Lighthouse can actually load them.
      - name: Serve static build
        run: npx --yes serve -s dist/public --listen 3000 &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
