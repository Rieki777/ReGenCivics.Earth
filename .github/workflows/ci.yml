name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # Non-blocking CVE check. Reports findings but does not fail the
      # build, since transitive deps occasionally land moderate CVEs we
      # don't control. Treat as a watchdog signal, follow up out-of-band.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level moderate || true

      - name: Unit tests
        run: pnpm test
        env:
          # Tests use in-memory mocks — no real DB needed
          JWT_SECRET: ci-test-secret
          DATABASE_URL: mysql://test:test@localhost:3306/test

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-test-secret
          DATABASE_URL: mysql://test:test@localhost:3306/test
          VITE_APP_ID: ci-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          retention-days: 1

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-public
          path: dist/public

      - name: Serve static build
        run: npx --yes serve dist/public --listen 3000 &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
