name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm exec tsc --noEmit

      # Foundation guards (audit Phase 1): unique migration numbers and a
      # complete .env.example. Cheap, fail fast.
      - name: Migration number guard
        run: node scripts/check-migration-numbers.mjs

      - name: Env example completeness
        run: node scripts/check-env-example.mjs

      # Non-blocking CVE check. Reports findings but does not fail the
      # build, since transitive deps occasionally land moderate CVEs we
      # don't control. Treat as a watchdog signal, follow up out-of-band.
      - name: Dependency audit (advisory)
        run: pnpm audit --audit-level moderate || true

      - name: Unit tests
        run: pnpm test
        env:
          # No DATABASE_URL here on purpose: DB-backed suites key their
          # skipIfNoDb guard on it. A fake URL makes them run against a dead
          # socket and fail with connection errors (this kept main's CI red
          # for weeks). The DB-backed suites run against the real dev DB in
          # the local ship gate (`pnpm test:all`); wiring them into GitHub CI
          # needs a fresh-schema build decision (see the note on the disabled
          # integration job below).
          JWT_SECRET: ci-test-secret

      - name: Build
        run: pnpm build
        env:
          NODE_ENV: production
          JWT_SECRET: ci-test-secret
          DATABASE_URL: mysql://test:test@localhost:3306/test
          VITE_APP_ID: ci-build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-public
          path: dist/public
          retention-days: 1

  # ── Integration tests against a real MySQL — PENDING a schema-build decision ──
  # The 13 DB-backed suites (evolution, ratification, forum, applications, ...)
  # should gate every push against a real database. The blocker: a fresh MySQL
  # can't be built from the numbered migrations alone — scripts/run-migration.ts
  # only applies 0048+, and the base schema (tables created up to 0047) lives
  # only in the drizzle-kit journal that drizzle/README.md freezes and forbids
  # `drizzle-kit push` from materializing. So a clean CI DB is missing the early
  # tables (game_variable_history, citizenship_tier_history, ...) and every
  # DB-backed suite errors with ER_NO_SUCH_TABLE.
  #
  # Until Rye picks a fresh-schema source (options in FOUNDATION_AUDIT_PLAN),
  # these suites run against the real dev DB in the LOCAL ship gate (test:all),
  # not here. This job is intentionally left disabled rather than red: a gate
  # that always fails is worse than one that is honestly absent.
  #
  #   integration:
  #     services: { mysql: mysql:8 ... }
  #     steps:
  #       - <build fresh schema — DECISION NEEDED>
  #       - run: pnpm test:all   # DATABASE_URL -> the service container

  # ── Evolution Engine machine gates (ASSEMBLY_PAGE_SPEC.md section 7.3) ──
  # Runs ONLY for PRs whose head branch is assembly/<proposalId>: the branches
  # the Rung 3 builder agent opens. Verifies the diff against the ratified
  # scope fetched from the PRODUCTION SERVER (never from a file on the branch
  # under review — the machine must not write its own permission slip), then
  # applies the gates-passed label the launch window waits for. Inert today:
  # no assembly/* branches exist below autonomy tier 3.
  assembly-gates:
    name: Assembly machine gates
    if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'assembly/') }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch ratified scope from the server (source of truth)
        run: |
          PROPOSAL_ID="${GITHUB_HEAD_REF#assembly/}"
          if ! [[ "$PROPOSAL_ID" =~ ^[0-9]+$ ]]; then
            echo "Branch does not carry a numeric proposal id; failing closed."
            exit 1
          fi
          INPUT=$(jq -cn --argjson id "$PROPOSAL_ID" '{json:{proposalId:$id}}' | jq -sRr @uri)
          SCOPE=$(curl -sf --max-time 30 "https://regencivics.earth/api/trpc/assembly.proposalScope?input=${INPUT}" \
            | jq -c '.result.data.json.scopePaths')
          if [ -z "$SCOPE" ] || [ "$SCOPE" = "null" ] || [ "$SCOPE" = "[]" ]; then
            echo "No ratified feature scope on proposal #$PROPOSAL_ID; failing closed."
            exit 1
          fi
          jq -n --argjson sp "$SCOPE" '{scopePaths: $sp}' > .assembly-scope.json
          echo "Server scope for proposal #$PROPOSAL_ID: $SCOPE"

      - name: Protected-paths check (fail closed)
        run: node scripts/check-protected-paths.mjs "origin/${GITHUB_BASE_REF}" "${GITHUB_SHA}"

      - name: Apply gates-passed label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr edit "${{ github.event.pull_request.number }}" --add-label gates-passed --repo "${{ github.repository }}"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-public
          path: dist/public

      - name: Serve static build
        run: npx --yes serve dist/public --listen 3000 &

      - name: Wait for server
        run: npx --yes wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
